<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="runBg" x1="0" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="runGlow" cx="300" cy="380" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#runBg)"/>
  <circle cx="300" cy="380" r="240" fill="url(#runGlow)"/>

  <!-- Speed lines -->
  <line x1="80" y1="360" x2="220" y2="360" stroke="#34d399" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <line x1="60" y1="400" x2="240" y2="400" stroke="#10b981" stroke-width="4" stroke-dasharray="16 10" opacity="0.8"/>
  <line x1="100" y1="440" x2="210" y2="440" stroke="#059669" stroke-width="3" stroke-dasharray="10 8" opacity="0.5"/>

  <!-- Running Athlete Silhouette -->
  <!-- Torso & Head -->
  <circle cx="350" cy="270" r="22" fill="#ffffff"/>
  <path d="M340 295 L315 385" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- Front Arm -->
  <path d="M335 320 L380 340 L405 320" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back Arm -->
  <path d="M335 320 L290 310 L260 345" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front Leg -->
  <path d="M315 385 L375 420 L420 480" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back Leg -->
  <path d="M315 385 L260 415 L230 470" stroke="#a7f3d0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Track Line -->
  <path d="M100 520 C250 500 450 510 520 540" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <text x="300" y="680" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">RUNNING</text>
  <text x="300" y="715" font-family="monospace" font-size="14" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">ENDURANCE &amp; PERSEVERANCE</text>
</svg>