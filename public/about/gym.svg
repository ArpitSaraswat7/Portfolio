<svg width="600" height="800" viewBox="0 0 600 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gymBg" x1="0" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="gymGlow" cx="300" cy="380" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#gymBg)"/>
  <circle cx="300" cy="380" r="240" fill="url(#gymGlow)"/>

  <!-- Dumbbell / Weight Visual -->
  <rect x="140" y="360" width="320" height="16" rx="8" fill="#e4e4e7"/>
  <!-- Left Plates -->
  <rect x="170" y="280" width="24" height="176" rx="10" fill="#f59e0b"/>
  <rect x="200" y="300" width="20" height="136" rx="8" fill="#d97706"/>
  <!-- Right Plates -->
  <rect x="406" y="280" width="24" height="176" rx="10" fill="#f59e0b"/>
  <rect x="380" y="300" width="20" height="136" rx="8" fill="#d97706"/>

  <!-- Grip Knurling -->
  <line x1="260" y1="368" x2="340" y2="368" stroke="#71717a" stroke-width="8" stroke-dasharray="4 3"/>

  <!-- Geometric accents -->
  <circle cx="300" cy="368" r="140" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <text x="300" y="680" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">DISCIPLINE</text>
  <text x="300" y="715" font-family="monospace" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="2">CONSISTENCY &amp; RESILIENCE</text>
</svg>