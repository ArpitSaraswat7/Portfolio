      <stop offset="0%" stop-color="#181028" />
      <stop offset="50%" stop-color="#120c1f" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
