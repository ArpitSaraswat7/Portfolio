    <text x="20" y="32" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11">Inference Latency</text>
    <text x="20" y="54" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="700">&lt; 14ms Realtime</text>
  </g>

  <g transform="translate(390, 180)">
    <rect width="150" height="70" rx="14" fill="#0d281e" stroke="#1b4d3e" stroke-width="1"/>
    <text x="20" y="32" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11">Deployment</text>
