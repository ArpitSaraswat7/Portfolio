    <text x="20" y="32" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11">Model Precision</text>
    <text x="20" y="54" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="700">98.4% mAP</text>
  </g>

  <g transform="translate(220, 180)">
