<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e16" />
      <stop offset="50%" stop-color="#04140f" />
      <stop offset="100%" stop-color="#020a07" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="24" fill="url(#bgGrad2)" stroke="#134e4a" stroke-width="2"/>
  <circle cx="480" cy="90" r="130" fill="#10b981" opacity="0.12" filter="blur(40px)"/>

  <!-- Computer Vision Emblem -->
  <g transform="translate(60, 60)">
    <rect width="72" height="72" rx="20" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="36" cy="36" r="6" fill="#34d399"/>
    <path d="M20 20L26 20 M20 20L20 26 M52 20L46 20 M52 20L52 26 M20 52L26 52 M20 52L20 46 M52 52L46 52 M52 52L52 46" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="150" y="88" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="3">AI &amp; COMPUTER VISION</text>
  <text x="150" y="118" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Clean Sight Architecture</text>
  <text x="150" y="140" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Real-Time YOLOv8 Inference Engine</text>

